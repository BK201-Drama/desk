<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>desk</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="board" id="board">
      <section class="pane-info">
        <div class="profile gh-link" id="ghProfile" title="打开 GitHub 主页">
          <div class="avatar" id="ghAvatar">K</div>
          <div class="profile-text">
            <div class="name">
              <span id="ghName">…</span> <span class="handle" id="ghHandle">@…</span>
            </div>
            <div class="bio" id="ghBio">加载 GitHub…</div>
          </div>
          <div class="stats">
            <b id="ghStreak">—</b>
            <span>day streak</span>
          </div>
        </div>

        <div class="row-clock-wall">
          <div class="clock">
            <div class="clock-time" id="time">--:--</div>
            <div class="clock-date" id="date">---</div>
            <div class="streak">今年 <strong id="yearCount">—</strong></div>
          </div>
          <div class="wall gh-link" id="ghWall" title="打开 GitHub 主页">
            <div class="wall-meta"><span>Contributions</span><span class="sync-hint" id="ghSync">GitHub …</span></div>
            <div class="grid" id="grid"></div>
          </div>
        </div>

        <div class="section-label">Pinned</div>
        <div class="pins" id="pins"></div>

        <div class="section-label">Languages</div>
        <div class="langs">
          <div class="lang-bar" id="langBar"></div>
          <div class="lang-legend" id="langLegend"></div>
        </div>

        <div class="mc">
          <div class="mc-head">
            <span class="brand">Multica</span>
            <button type="button" class="mc-open" id="mcOpen">打开看板 →</button>
          </div>
          <div class="mc-stats">
            <span class="mc-pill warn"><strong id="mcInbox">—</strong> inbox</span>
            <span class="mc-pill go"><strong id="mcDoing">—</strong> doing</span>
            <span class="mc-pill"><strong id="mcReview">—</strong> review</span>
          </div>
          <div class="mc-list" id="mcList"></div>
          <div class="mc-foot">
            <span class="live" id="mcLive">runtime …</span>
            <span id="mcFootHint">本地实例</span>
          </div>
        </div>

        <div class="remind">
          <div class="remind-head">
            <span class="remind-label">待办</span>
            <button type="button" class="remind-add" id="addTodo">+ 待办</button>
          </div>
          <div class="remind-items" id="remindItems"></div>
        </div>

        <div class="todo-pop" id="todoPop">
          <label>待办</label>
          <input id="todoTitle" type="text" placeholder="例如：买洗洁精" />
          <div class="row2">
            <div>
              <label>周期</label>
              <select id="todoRule">
                <option value="once">一次性</option>
                <option value="1m" selected>每 1 月</option>
                <option value="1w">每 1 周</option>
                <option value="on15">每月 15 日</option>
              </select>
            </div>
            <div>
              <label>提示</label>
              <input type="text" readonly value="可添加多条 · 持久化本机" />
            </div>
          </div>
          <div class="actions">
            <button type="button" id="todoCancel">取消</button>
            <button type="button" class="primary" id="todoSave">添加</button>
          </div>
        </div>
      </section>

      <section class="pane-fences">
        <div class="fences-toolbar">
          <div class="fences-head">
            <h2>全部图标 <span id="fenceCount" style="font-weight:400;opacity:.6"></span></h2>
            <div class="head-actions">
            <button type="button" class="icon-btn" id="autostartToggle" title="开机自启" aria-label="开机自启">
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="M8 2.2v5.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                <path d="M5.05 4.35a4.2 4.2 0 1 0 5.9 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
            </button>
            <button type="button" class="icon-btn" id="fenceRestore" title="还原到系统桌面" aria-label="还原到系统桌面">
              <svg viewBox="0 0 16 16" aria-hidden="true">
                <path d="M4.2 6.2A4.2 4.2 0 1 1 3.8 9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                <path d="M4.2 3.2v3.2H7.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <button type="button" class="icon-btn" id="editToggle" title="编辑" aria-label="编辑">
              <svg class="ico-edit" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M10.6 3.1 12.9 5.4 6.2 12.1H3.9v-2.3L10.6 3.1z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                <path d="M9.5 4.2 11.8 6.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
              <svg class="ico-done" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M3.4 8.3 6.5 11.3 12.6 4.7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>
        <input
          type="text"
          class="fence-search"
          id="fenceSearch"
          placeholder="搜索图标…  /"
          autocomplete="off"
          spellcheck="false"
        />
        </div>
        <div id="fenceSearchResults" class="fence-search-results" hidden></div>
        <div id="fenceRecent" hidden></div>
        <div id="fences"></div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
