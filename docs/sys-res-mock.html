<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>desk · sys-res 设计稿 v3</title>
  <style>
    :root {
      --ink: #1a2332;
      --ink-soft: #3d4a5c;
      --mist-border: rgba(255, 255, 255, 0.45);
      --glass: rgba(248, 250, 252, 0.72);
      --track: rgba(26, 35, 50, 0.08);
      --c0: #2d6a4f;
      --c1: #52b788;
      --c2: #95d5b2;
      --c3: rgba(26, 35, 50, 0.14);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 20% 10%, #c5d5c8 0%, transparent 55%),
        radial-gradient(900px 500px at 80% 80%, #b8c4d4 0%, transparent 50%),
        linear-gradient(160deg, #8fa89a, #6b7c8f 55%, #5a6a7a);
    }
    .note {
      position: fixed;
      top: 16px;
      left: 16px;
      font-size: 12px;
      color: rgba(255,255,255,0.88);
      max-width: 320px;
      line-height: 1.45;
    }
    .board {
      width: 220px;
      padding: 10px 12px 11px;
      border-radius: 14px;
      background: var(--glass);
      box-shadow: inset 0 0 0 1px var(--mist-border);
      backdrop-filter: blur(24px) saturate(1.35);
      -webkit-backdrop-filter: blur(24px) saturate(1.35);
    }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .cell {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      min-width: 0;
    }
    .ring {
      position: relative;
      width: 78px;
      height: 78px;
    }
    .ring svg {
      width: 78px;
      height: 78px;
      transform: rotate(-90deg);
    }
    .ring path {
      fill: none;
      stroke-width: 9;
      stroke-linecap: butt;
      cursor: pointer;
      transition: opacity 0.15s ease, stroke-width 0.15s ease;
    }
    .ring path:hover,
    .ring path.hot {
      stroke-width: 11;
      opacity: 1;
    }
    .ring path.dim { opacity: 0.35; }
    .center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      font-family: "Cascadia Code", Consolas, monospace;
      text-align: center;
      line-height: 1.15;
      padding: 0 4px;
    }
    .center .pct {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
    }
    .center .sub {
      font-size: 8.5px;
      color: rgba(26, 35, 50, 0.45);
      max-width: 54px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .center .sub.is-app {
      color: var(--c0);
      font-weight: 600;
    }
    .cap {
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 9px;
      color: rgba(26, 35, 50, 0.4);
    }
  </style>
</head>
<body>
  <p class="note">v3：占比画在环上（分段）。悬停/点击某段 → 环心显示该应用。<br/>无列表。刷新本地 HTML 可试。</p>
  <div class="board">
    <div class="row">
      <div class="cell">
        <div class="ring" id="mem" aria-label="内存占比"></div>
        <div class="cap">内存</div>
      </div>
      <div class="cell">
        <div class="ring" id="cpu" aria-label="CPU 占比"></div>
        <div class="cap">CPU</div>
      </div>
    </div>
  </div>
  <script>
    /** segments: share of full ring 0–100; last is remainder (free/other) */
    const memSegs = [
      { name: "chrome", value: "1.8G", pct: 22, color: "var(--c0)" },
      { name: "Cursor", value: "1.2G", pct: 15, color: "var(--c1)" },
      { name: "qqmusic", value: "680M", pct: 8, color: "var(--c2)" },
      { name: "其他/空闲", value: "12.3G", pct: 55, color: "var(--c3)" },
    ];
    const cpuSegs = [
      { name: "chrome", value: "12%", pct: 12, color: "var(--c0)" },
      { name: "Cursor", value: "9%", pct: 9, color: "var(--c1)" },
      { name: "desk", value: "2%", pct: 2, color: "var(--c2)" },
      { name: "其他/空闲", value: "77%", pct: 77, color: "var(--c3)" },
    ];

    const R = 30;
    const C = 2 * Math.PI * R;

    function mount(el, segs, idleLabel) {
      const svgNS = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(svgNS, "svg");
      svg.setAttribute("viewBox", "0 0 78 78");
      const cx = 39, cy = 39;

      const center = document.createElement("div");
      center.className = "center";
      const pctEl = document.createElement("div");
      pctEl.className = "pct";
      const subEl = document.createElement("div");
      subEl.className = "sub";
      center.append(pctEl, subEl);
      el.append(svg, center);

      const used = segs.slice(0, -1).reduce((s, x) => s + x.pct, 0);
      function showIdle() {
        pctEl.textContent = `${Math.round(used)}%`;
        subEl.textContent = idleLabel;
        subEl.classList.remove("is-app");
        svg.querySelectorAll("path").forEach((p) => {
          p.classList.remove("hot", "dim");
        });
      }

      let offset = 0;
      const paths = [];
      segs.forEach((seg, i) => {
        const path = document.createElementNS(svgNS, "path");
        // full circle path via stroke-dash
        const circle = document.createElementNS(svgNS, "circle");
        circle.setAttribute("cx", cx);
        circle.setAttribute("cy", cy);
        circle.setAttribute("r", R);
        circle.setAttribute("fill", "none");
        circle.setAttribute("stroke", seg.color);
        circle.setAttribute("stroke-width", "9");
        circle.setAttribute("stroke-dasharray", `${(seg.pct / 100) * C} ${C}`);
        circle.setAttribute("stroke-dashoffset", `${-offset * C / 100}`);
        circle.style.cursor = "pointer";
        circle.dataset.i = String(i);

        const activate = () => {
          paths.forEach((p) => {
            p.classList.toggle("hot", p === circle);
            p.classList.toggle("dim", p !== circle);
          });
          if (i === segs.length - 1) {
            pctEl.textContent = `${seg.pct}%`;
            subEl.textContent = "其余";
            subEl.classList.remove("is-app");
          } else {
            pctEl.textContent = seg.value;
            subEl.textContent = seg.name;
            subEl.classList.add("is-app");
          }
        };
        circle.addEventListener("mouseenter", activate);
        circle.addEventListener("click", activate);
        circle.addEventListener("mouseleave", showIdle);

        svg.appendChild(circle);
        paths.push(circle);
        offset += seg.pct;
      });

      el.addEventListener("mouseleave", showIdle);
      showIdle();
    }

    mount(document.getElementById("mem"), memSegs, "8.1/16G");
    mount(document.getElementById("cpu"), cpuSegs, "整机");
  </script>
</body>
</html>
